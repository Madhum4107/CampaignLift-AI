name: CampaignLift CI
permissions:
  contents: read
on: [push, pull_request, workflow_dispatch]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r uplift-modeling-main/requirements.txt
      - name: Train reproducible artifacts
        run: cd uplift-modeling-main && python train.py
      - name: Run API and unit tests
        run: cd uplift-modeling-main && python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install locked dependencies
        run: cd uplift-modeling-main/frontend && npm ci
      - name: Audit dependencies
        run: cd uplift-modeling-main/frontend && npm audit --audit-level=high
      - name: Production build
        run: cd uplift-modeling-main/frontend && npm run build
