name: CampaignLift CI
on: [push, pull_request, workflow_dispatch]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r uplift-modeling-main/requirements.txt
      - name: Train reproducible artifacts
        run: cd uplift-modeling-main && python train.py
      - name: Run API and unit tests
        run: cd uplift-modeling-main && python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend packages
        run: cd uplift-modeling-main/frontend && npm install
      - name: Apply compatible security updates
        run: cd uplift-modeling-main/frontend && npm audit fix --audit-level=high
      - name: Production build
        run: cd uplift-modeling-main/frontend && npm run build
      - name: Upload generated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: campaignlift-frontend-lockfile
          path: uplift-modeling-main/frontend/package-lock.json
