name: CampaignLift CI
on:
  push:
    branches: [main, master]
  paths:
    - "uplift-modeling-main/**"
    - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "uplift-modeling-main/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uplift-modeling-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uplift-modeling-main/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python train.py
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uplift-modeling-main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: uplift-modeling-main/frontend/package-lock.json
      - run: npm install
      - run: npm run build
